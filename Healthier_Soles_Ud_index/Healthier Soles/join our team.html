<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Our Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EFE4;
    --sage:#DCE9E1;
    --deep-green:#1F3A2E;
    --leaf-green:#4C9A4C;
    --leaf-green-dark:#3F8340;
    --text-gray:#767873;
    --border:#C9D6CD;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito Sans', sans-serif;
    background:var(--cream);
    color:var(--deep-green);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  .card{
    width:100%;
    max-width:600px;
    background:var(--sage);
    border-radius:20px;
    padding:48px 44px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:34px;
    color:var(--deep-green);
    margin-bottom:14px;
  }
  .intro{
    font-size:15px;
    color:var(--text-gray);
    line-height:1.6;
    margin-bottom:32px;
    max-width:46ch;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--deep-green);
    margin-bottom:7px;
  }
  .field .hint{
    font-weight:400;
    color:var(--text-gray);
    font-size:12px;
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    padding:12px 14px;
    font-family:'Nunito Sans', sans-serif;
    font-size:14px;
    color:var(--deep-green);
    background:var(--white);
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--leaf-green);
    box-shadow:0 0 0 3px rgba(76,154,76,0.18);
  }
  .field textarea{
    resize:vertical;
    min-height:90px;
    line-height:1.5;
  }
  .submit-btn{
    margin-top:8px;
    padding:14px 28px;
    background:var(--leaf-green);
    color:var(--white);
    border:none;
    border-radius:999px;
    font-family:'Nunito Sans', sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease;
    align-self:flex-start;
  }
  .submit-btn:hover{ background:var(--leaf-green-dark); }
  .fine-print{
    font-size:12px;
    color:var(--text-gray);
    line-height:1.5;
  }
  .success{
    display:none;
    text-align:center;
    padding:30px 10px;
  }
  .success.show{ display:block; }
  .success-mark{
    width:48px; height:48px;
    border-radius:50%;
    background:var(--white);
    color:var(--leaf-green);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px auto;
    font-size:22px;
    font-weight:700;
  }
  .success h3{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:24px;
    margin-bottom:8px;
    color:var(--deep-green);
  }
  .success p{
    font-size:14px;
    color:var(--text-gray);
    max-width:38ch;
    margin:0 auto;
    line-height:1.6;
  }
  @media (max-width:520px){
    .card{padding:34px 26px; border-radius:16px;}
    .row{grid-template-columns:1fr;}
    h1{font-size:28px;}
  }
</style>
</head>
<body>
  <div class="card">
    <div id="formView">
      <h1>Join Our Team</h1>
      <p class="intro">Volunteer alongside us at fundraisers and mission trips throughout the year. Tell us a bit about yourself.</p>

      <form id="joinForm">
        <div class="row">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Your name">
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" required placeholder="+91 00000 00000">
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="message">Anything else you'd like to share? <span class="hint">(optional)</span></label>
          <textarea id="message" name="message" placeholder="Tell us a little about why you'd like to join."></textarea>
        </div>

        <button type="submit" class="submit-btn">Join Our Team</button>
        <p class="fine-print">We'll get back to you within a few days of receiving your details.</p>
      </form>
    </div>

    <div class="success" id="successView">
      <div class="success-mark">✓</div>
      <h3>Welcome aboard</h3>
      <p>Thanks for stepping up. We've received your details and will reach out soon.</p>
    </div>
  </div>

<script>
  const form = document.getElementById('joinForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    // Connect this form to your backend or a form service (e.g. Formspree) via the action attribute
    // or an async fetch() call here before showing the success state.
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
  });
</script>
</body>
</html>
